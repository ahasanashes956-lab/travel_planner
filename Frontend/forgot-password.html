<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Travel Planner</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=20260909-notification-ui">
    <link rel="stylesheet" href="css/ui-polish.css?v=20260911-coastal-atlas">
</head>
<body>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-0 shadow p-4">
                    <h2 class="text-center mb-3">Reset Password</h2>
                    <p class="text-muted text-center">Enter your registered email to continue.</p>
                    <form id="forgotPasswordForm">
                        <label class="form-label" for="email">Email Address</label>
                        <input class="form-control mb-3" id="email" type="email" required>
                        <button class="btn btn-primary w-100" type="submit">Create Reset Link</button>
                    </form>
                    <div id="message" class="mt-3"></div>
                    <a class="d-block text-center mt-3" href="login.html">Back to Login</a>
                </div>
            </div>
        </div>
    </main>
    <script>
        const apiBaseUrl = window.location.origin === 'null' ? 'http://localhost:8000' : window.location.origin;
        document.getElementById('forgotPasswordForm').addEventListener('submit', async event => {
            event.preventDefault();
            const message = document.getElementById('message');
            const email = document.getElementById('email').value.trim();
            try {
                const response = await fetch(`${apiBaseUrl}/api/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || 'Could not create reset link.');
                if (data.resetLink) {
                    window.location.href = data.resetLink;
                    return;
                }
                message.className = 'alert alert-success mt-3';
                message.textContent = data.message;
            } catch (error) {
                message.className = 'alert alert-danger mt-3';
                message.textContent = error.message;
            }
        });
    </script>
</body>
</html>
