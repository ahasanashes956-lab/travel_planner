<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Travel Planner</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=20260909-notification-ui">
    <link rel="stylesheet" href="css/ui-polish.css?v=20260908-ui">
</head>
<body class="bg-light">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fas fa-map-marker-alt text-success me-2"></i>Travel Planner BD
            </a>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4 fw-bold">
                            <i class="fas fa-sign-in-alt text-primary me-2"></i>Welcome Back
                        </h2>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="loginEmail" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="loginEmail" name="email" required>
                            </div>

                            <div class="mb-3">
                                <label for="loginPassword" class="form-label">Password</label>
                                <input type="password" class="form-control" id="loginPassword" name="password" required>
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe" name="rememberMe">
                                <label class="form-check-label" for="rememberMe">Remember me</label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold mb-2">Login as User</button>
                        </form>

                        <div class="d-grid mt-2">
                            <button id="loginAsAdminBtn" type="button" class="btn btn-outline-secondary btn-lg">Admin Portal</button>
                        </div>
                        <hr>
                        <p class="text-center text-muted mb-2">
                            Don't have an account? <a href="register.html" class="text-primary fw-bold">Register</a>
                        </p>
                        <p class="text-center text-muted">
                            <a href="forgot-password.html" class="text-primary">Forgot Password?</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p class="mb-1">&copy; 2026 Travel Planner BD. Based in Bangladesh. All rights reserved.</p>
            <p class="small mb-0">Contact: info@travelplannerbd.com | +8801XXXXXXXXX</p>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js?v=20260922-auth-stability-fix"></script>
    <script src="js/auth.js?v=20260922-auth-stability-fix"></script>
</body>
</html>
