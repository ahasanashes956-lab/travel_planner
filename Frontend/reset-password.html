<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Travel Planner</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=20260909-notification-ui">
    <link rel="stylesheet" href="css/ui-polish.css?v=20260911-coastal-atlas">
</head>
<body>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-0 shadow p-4">
                    <h2 class="text-center mb-3">Set New Password</h2>
                    <form id="resetPasswordForm">
                        <label class="form-label" for="password">New Password</label>
                        <input class="form-control mb-3" id="password" type="password" minlength="6" required>
                        <label class="form-label" for="confirmPassword">Confirm Password</label>
                        <input class="form-control mb-3" id="confirmPassword" type="password" minlength="6" required>
                        <button class="btn btn-primary w-100" type="submit">Update Password</button>
                    </form>
                    <div id="message" class="mt-3"></div>
                    <a class="d-block text-center mt-3" href="login.html">Back to Login</a>
                </div>
            </div>
        </div>
    </main>
    <script>
        const apiBaseUrl = window.location.origin === 'null' ? 'http://localhost:8000' : window.location.origin;
        const query = new URLSearchParams(window.location.search);
        const email = query.get('email');
        const token = query.get('token');
        document.getElementById('resetPasswordForm').addEventListener('submit', async event => {
            event.preventDefault();
            const message = document.getElementById('message');
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            try {
                const response = await fetch(`${apiBaseUrl}/api/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, token, newPassword: password, confirmPassword })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || 'Password reset failed.');
                message.className = 'alert alert-success mt-3';
                message.textContent = data.message + ' Redirecting to login...';
                setTimeout(() => window.location.href = 'login.html', 1200);
            } catch (error) {
                message.className = 'alert alert-danger mt-3';
                message.textContent = error.message;
            }
        });
    </script>
</body>
</html>
